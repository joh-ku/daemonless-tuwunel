build:
  pkg_name: tuwunel
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
      args:
        BASE_VERSION: "15.1"
        BUILDER_BASE_VERSION: "15.1-latest"
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15.1-latest"
cit:
  mode: health
  port: 8008
  health: /_matrix/client/versions
  ready: "Listening on"
